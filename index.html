<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">

<title>F1 Live Dashboard</title>
<style>

*{box-sizing:border-box}

.card{background:rgba(16,10,32,.78);border:1px solid #33264f;border-radius:10px;padding:8px 10px;overflow-x:auto}

.pos{border-radius:3px;text-align:center;font-weight:800;padding:3px 0;text-shadow:0 1px 2px #000a}
.tla{font-weight:800;letter-spacing:.03em}
.ty{width:18px;height:18px;border-radius:50%;border:2px solid;display:grid;place-items:center;font-size:9px;font-weight:800}
.ty.S{border-color:#ff3b3b}.ty.M{border-color:#ffd93b}.ty.H{border-color:#fff}.ty.I{border-color:#3bdc5a}.ty.W{border-color:#3b9bff}

.mu{color:#a99cc9;text-align:right}.sc{display:flex;gap:3px}.sc i{flex:1;height:8px;border-radius:2px;background:#3a2d58}
.sp{background:#b84dff!important}.sg{background:#2ee66b!important}.sy{background:#ffd93b!important}
.tw{display:grid;gap:0 12px}@media(min-width:900px){.tw{grid-auto-flow:column;grid-template-rows:repeat(11,auto)}}
.tr{display:grid;grid-template-columns:26px 40px 44px 64px 44px 62px 62px 1fr;gap:6px;align-items:center;padding:4px 6px;border-radius:4px;background:#ffffff0a;margin-bottom:2px;min-width:600px;font-variant-numeric:tabular-nums}
.tr.out{background:#a8201a66}.tr.ret{opacity:.4;filter:grayscale(1)}
.gp{display:flex;flex-direction:column;text-align:right}.gp b{font-weight:700}.gp em{font-style:normal;color:#a99cc9;font-size:10px}
.sg2{display:flex;gap:5px}.sgm{display:flex;gap:1px;flex:1}.sgm i{flex:1;height:10px;border-radius:1px;background:#3a2d58}
.vp{background:#b84dff!important}.vg{background:#2ee66b!important}.vy{background:#ffd93b!important}.vb{background:#4aa3ff!important}
.ph{background:#6d3df2;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:800;margin-right:6px}.ph:empty{display:none}
.pg{margin:0 14px 10px;display:none;align-items:center;gap:10px;font-weight:700}.pg.on{display:flex}.pgb{flex:1;height:6px;background:#2d2147;border-radius:3px;overflow:hidden}.pgb i{display:block;height:100%;background:#e10600;width:0}
canvas{width:100%;height:300px;display:block}
.row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #261b3c}.row:last-child{border:0}
.row .p{width:18px;text-align:right;color:#a99cc9}.bar{width:4px;height:16px;border-radius:2px}.row .n{flex:1;font-weight:700}.row .n small{color:#a99cc9;font-weight:400;margin-left:6px}
.d{color:#37e07a;font-weight:800;width:34px;text-align:right}.d.z{color:#6d6288;font-weight:400}.t{width:38px;text-align:right;font-weight:800}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:900px){.mini{grid-template-columns:repeat(4,1fr)}}
.m{display:flex;justify-content:space-between;padding:2px 0;font-variant-numeric:tabular-nums}.m b{color:#fff}
.tyc{display:flex;align-items:center;gap:4px}.tyc small{color:#cfc6e8;font-size:10px}
.car{display:flex;flex-direction:column;text-align:center;line-height:1.1}.car b{font-size:12px}.car em{font-style:normal;font-size:9px;color:#a99cc9}
.ar{width:12px;font-size:9px}.ar.up{color:#37e07a}.ar.dn{color:#ff4a4a}
.strip{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}.strip:empty{display:none}

.chip em{font-style:normal;font-size:9px;color:#a99cc9;text-transform:uppercase;letter-spacing:.08em}.chip b{font-size:13px}
.wd{display:inline-block}
iframe{width:100%;height:210px;border:0;border-radius:8px;display:block}
.m{display:grid;grid-template-columns:14px 40px auto;gap:6px;align-items:center;justify-content:start;padding:4px 8px;margin-bottom:3px;border-radius:6px;border-left:3px solid var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,transparent) var(--w),#ffffff0a var(--w))}
.mi{color:#a99cc9;text-align:right;font-size:10px}.mt{letter-spacing:.03em}.mv{margin-left:6px}
.rp{display:flex;flex-direction:column;gap:8px;padding:0 14px 10px}.rc{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rp button,.rp input{background:#1b1230;color:#f2eefc;border:1px solid #3a2d58;border-radius:8px;padding:6px 11px;font:inherit;transition:background .15s,transform .1s}
.rp button{cursor:pointer}.rp button:active,.rp button.pr{background:#6d3df2;transform:scale(.94)}
.rp button.on{background:#1f8f4a;border-color:#37e07a}.rp button:disabled{opacity:.7}.rp input[type=number]{width:72px}.rp input[type=range]{flex:1;min-width:140px;padding:0}
.gps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.gp2{flex:0 0 auto;background:#1b1230;border:1px solid #3a2d58;border-radius:10px;padding:6px 11px;cursor:pointer}
.gp2 b{display:block;font-size:12px}.gp2 small{color:#a99cc9;font-size:10px}.gp2.sel{background:#3b1d86;border-color:#9b6bff}
.ses{display:flex;gap:6px;flex-wrap:wrap}.ses button.sel{background:#3b1d86;border-color:#9b6bff}
.sgm.old{opacity:.4}.g1{display:flex;align-items:flex-end;gap:3px}.g1 b{font-size:12px}.gr{display:flex;gap:1px;align-items:flex-end;height:13px}.gr i{width:2px;background:#3a2d58}.gr i.on{background:#9b6bff}
.flag{margin:0 14px 10px;padding:8px 12px;border-radius:8px;font-weight:800;letter-spacing:.06em;display:none}.flag.on{display:block}
.fY,.fVSC{background:#ffd93b;color:#111}.fSC{background:#ff9f1c;color:#111}.fRED{background:#e10600}.fCHEQ{background:#fff;color:#111}
.note{padding:0 14px 14px;color:#9b90b8;font-size:11px;max-width:1500px;margin:auto}
.full{grid-column:1/-1}
</style></head><body>

  <div class="card"><h2>Piloti · top 10 (proiezione)</h2><div id="drv"></div></div>

</div>

<script>
const T={RBR:["Red Bull","#3671C6"],FER:["Ferrari","#E8002D"],MER:["Mercedes","#27F4D2"],MCL:["McLaren","#FF8000"],WIL:["Williams","#64C4FF"],RB:["Racing Bulls","#6692FF"],AST:["Aston Martin","#229971"],HAA:["Haas","#B6BABD"],AUD:["Audi","#F50537"],ALP:["Alpine","#FF87BC"],CAD:["Cadillac","#9aa0a6"]};

 const t=Date.now()/1000,qm=Math.floor(t/30)%2===0;

 const cars=order.map((c,i)=>{const u=(t*0.02-i*0.012+1)%1,a=u*6.283;return{tla:c,color:T[info[c][2]][1],x:Math.cos(a)*5000+Math.cos(a*3)*700,y:Math.sin(a)*3000+Math.sin(a*2)*500}});
 return{hasData:true,session:qm?"Qualifying":"Race",meeting:"Demo",track:"",part:qm?1:0,gmt:"08:00:00",geo:{lat:1.2914,lon:103.8644},wx:{AirTemp:"29.4",TrackTemp:"36.2",Humidity:"78",WindSpeed:"2.1",WindDirection:"210",Rainfall:"0"},clock:{rem:"00:"+String((1080-Math.floor(t%1080))/60|0).padStart(2,"0")+":"+String((1080-Math.floor(t%1080))%60).padStart(2,"0")},lap:1+Math.floor(t/8)%62,total:62,status:"Started",flag:{code:["","","Y","","VSC","",""][Math.floor(t/10)%7],txt:""},rain:{mm:[0,0.4,3.1,9][Math.floor(t/10)%4]},rows,cars,standings:SAMPLE};
}

function phase(j){const n=j.session||"",p=j.part||"";
 if(n==="Sprint Qualifying"||n==="Sprint Shootout")return"SQ"+p;

 return `<span class="g1"><b>${h.g===0?"N":h.g}</b><span class="gr">${Array.from({length:8},(_,i)=>`<i class="${i<h.g?"on":""}" style="height:${5+i*1.2}px"></i>`).join("")}</span></span><em>${h.s||""}</em>`}

function render(j){
 const sess=j.session,pts=PTS[sess]||[],B=j.standings||{};
 const q=/Qualifying|Shootout/.test(j.session),pt=j.part||0;const cls=(r,i)=>r.ret?"ret":q&&pt>0?((pt===1&&i>=16)||(pt===2&&i>=10&&i<16)?"out":(pt===2&&i>=16)||(pt===3&&i>=10)?"ret":""):"";
 $("tower").innerHTML=j.rows.map((r,i)=>`<div class="tr ${cls(r,i)}"><span class="pos" style="background:${r.color}">${i+1}</span><span class="tla">${r.tla}</span><span class="tyc"><span class="ty ${r.tyre}">${r.tyre}</span><small>${r.tl||""}</small></span><span class="car">${gearHtml(r)}</span><span class="pit ${r.pit?"on":r.ovt?"ov":""}">${r.pit?"PIT":r.ovt?"OVT":""}</span><span class="gp"><b>${i?r.int:"Leader"}</b><em>${i?r.gap:""}</em></span><span class="gp"><b>${r.last}</b><em>${r.best}</em></span><span class="sg2">${segs(r)}</span></div>`).join("");
 const gain={};D.forEach(d=>gain[d[0]]=0);j.rows.forEach((r,i)=>gain[r.tla]=pts[i]||0);
 const L=D.map(d=>({c:d[0],g:gain[d[0]],t:(B[d[0]]||0)+gain[d[0]]})).sort((a,b)=>b.t-a.t).slice(0,10);
 const bd=Object.fromEntries(D.map(d=>d[0]).sort((a,b)=>(B[b]||0)-(B[a]||0)).map((c,i)=>[c,i]));
 $("drv").innerHTML=L.map((x,i)=>bar(x.c,T[info[x.c][2]][1],i+1,`<span class="d ${x.g?"":"z"}">${x.g?"+"+x.g:"–"}</span><span class="t">${x.t}</span>`,info[x.c][1],bd[x.c]-i)).join("");
 const ct={};D.forEach(d=>{const k=d[2];ct[k]=ct[k]||{g:0,t:0};ct[k].g+=gain[d[0]];ct[k].t+=(B[d[0]]||0)+gain[d[0]]});
 const cb=Object.fromEntries(Object.keys(ct).sort((a,b)=>(ct[b].t-ct[b].g)-(ct[a].t-ct[a].g)).map((k,i)=>[k,i]));
 $("con").innerHTML=Object.entries(ct).sort((a,b)=>b[1].t-a[1].t).map(([k,v],i)=>bar(T[k][0],T[k][1],i+1,`<span class="d ${v.g?"":"z"}">${v.g?"+"+v.g:"–"}</span><span class="t">${v.t}</span>`,"",cb[k]-i)).join("");
 const mrow=(i,r,v,pct)=>`<div class="m" style="--w:${pct}%;--c:${r.color}"><span class="mi">${i}</span><b class="mt">${r.tla}</b><b class="mv">${v}</b></div>`;
 const sp=j.rows.filter(r=>r.st).sort((a,b)=>b.st-a.st).slice(0,10);
 $("spd").innerHTML=sp.map((r,i)=>mrow(i+1,r,r.st+" km/h",35+65*(r.st-sp[sp.length-1].st)/((sp[0].st-sp[sp.length-1].st)||1))).join("");
 [0,1,2].forEach(k=>{const a=j.rows.filter(r=>r.secs[k].v).sort((x,y)=>parseFloat(x.secs[k].v)-parseFloat(y.secs[k].v)).slice(0,10);const b=a.length?parseFloat(a[0].secs[k].v):1;$("s"+k).innerHTML=a.map((r,i)=>mrow(i+1,r,r.secs[k].v,Math.max(25,100-(parseFloat(r.secs[k].v)-b)/b*1200))).join("")});

}
function drawMap(cars){
 const c=$("map"),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;
 const g=c.getContext("2d");g.scale(dpr,dpr);if(!TR.length)return;
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;TR.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
 const s=Math.min((w-30)/(x1-x0||1),(h-30)/(y1-y0||1)),ox=(w-(x1-x0)*s)/2,oy=(h-(y1-y0)*s)/2;
 const X=x=>ox+(x-x0)*s,Y=y=>h-(oy+(y-y0)*s);
 if(LINE){g.strokeStyle="#6b5a9a";g.lineWidth=7;g.lineJoin="round";g.lineCap="round";g.beginPath();TR.forEach(([x,y],i)=>i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y)));g.closePath();g.stroke();g.strokeStyle="#0b0714";g.lineWidth=2;g.stroke()}
 else{g.fillStyle="#6b5a9a";TR.forEach(([x,y])=>{g.beginPath();g.arc(X(x),Y(y),2.2,0,7);g.fill()})}
 cars.forEach(k=>{g.fillStyle=k.color;g.beginPath();g.arc(X(k.x),Y(k.y),5,0,7);g.fill();g.fillStyle="#fff";g.font="bold 9px system-ui";g.fillText(k.tla,X(k.x)+7,Y(k.y)+3)});
}
let LAST=null,radKey="";

function rainTxt(j,w){const mm=j.rain&&j.rain.mm!=null?+j.rain.mm:null,wet=w.Rainfall==="1";
 if(mm==null)return wet?"In corso":"Asciutto";
 const l=mm<0.1?(wet?"Leggera":"Asciutto"):mm<2.5?"Leggera":mm<7.6?"Moderata":"Forte";return mm.toFixed(1)+" mm/h · "+l}
const FT={Y:"BANDIERA GIALLA",SC:"SAFETY CAR",SCE:"SAFETY CAR IN RIENTRO",VSC:"VIRTUAL SAFETY CAR",VSCE:"VSC IN CHIUSURA",RED:"BANDIERA ROSSA · SESSIONE SOSPESA",CHEQ:"BANDIERA A SCACCHI"};

 const w=j.wx||{},c=j.clock||{},q=!["Race","Sprint"].includes(j.session),ch=[];

 if(q&&c.rem){const p=c.rem.split(":").map(Number);let ms=((p[0]*60+p[1])*60+p[2])*1000;if(c.ext&&c.utc)ms-=Date.now()-Date.parse(c.utc);ch.push(["Tempo rimanente",hms(ms)])}
 if(w.AirTemp!=null)ch.push(["Aria",w.AirTemp+"°C"],["Pista",w.TrackTemp+"°C"],["Umidità",w.Humidity+"%"],["Vento",`<span class="wd" style="transform:rotate(${(+w.WindDirection||0)+180}deg)">↑</span> ${w.WindSpeed} m/s`],["Pioggia",rainTxt(j,w)]);

 if(j.geo){const k=j.geo.lat+","+j.geo.lon;if(k!==radKey){radKey=k;$("rad").src=`https://embed.windy.com/embed.html?type=map&location=coordinates&zoom=8&overlay=radar&product=radar&level=surface&lat=${j.geo.lat}&lon=${j.geo.lon}&detailLat=${j.geo.lat}&detailLon=${j.geo.lon}&marker=true&metricTemp=%C2%B0C&metricWind=m%2Fs`}}}
let tk=0,trkV;
async function poll(){
 let j;
 try{const r=await fetch("/state");j=await r.json();demo=false;
  if(j.trk!==trkV||tk++%10===0||!TR.length){const ch=j.trk!==trkV;trkV=j.trk;const t=await (await fetch("/track")).json();if(ch||(t.pts&&t.pts.length)){TR=t.pts||[];LINE=!!t.line}}}
 catch(e){demo=true;j=demoState();}
 $("st").textContent=demo?"DEMO":(j.hasData?"LIVE":"OFF");$("st").className="live"+(demo||!j.hasData?" off":"");
 const race=["Race","Sprint"].includes(j.session);
 $("ph").textContent=j.hasData?phase(j):"";
 $("pg").className="pg"+(race&&j.total?" on":"");
 if(race&&j.total){$("lap").textContent="Giro "+j.lap+"/"+j.total;$("pgi").style.width=Math.min(100,j.lap/j.total*100)+"%"}
 const stt={Aborted:" · SOSPESA",Finished:" · TERMINATA",Finalised:" · TERMINATA",Ends:" · TERMINATA"}[j.status]||"";
 $("info").textContent=j.hasData?(j.meeting+" · "+j.session+(j.track?" · "+j.track:"")+stt):"";
 $("msg").textContent=demo?"Modalità demo con dati simulati: collegando il server vedrai i dati reali.":(j.hasData?(["Race","Sprint"].includes(j.session)?"":"I punti si proiettano solo in Gara e Sprint."):"In attesa di una sessione F1 live (il feed è attivo solo durante le sessioni).");
 if(j.meeting+j.session!==sig){sig=j.meeting+j.session;for(const k in HELD)delete HELD[k];for(const k in HG)delete HG[k]}
 if(j.hasData)render(j);LAST=j;strip(j);fl(j);rp(j);
}
let drag=false,SL=[],selM=null,selK=null;
const SN={"Practice 1":"FP1","Practice 2":"FP2","Practice 3":"FP3","Sprint Qualifying":"SQ","Sprint Shootout":"SQ","Sprint":"Sprint","Qualifying":"Quali","Race":"Gara"};
const ctl=q=>fetch("/replay/ctl?"+q).catch(()=>{});
const act=(b,fn)=>{b.classList.add("pr");setTimeout(()=>b.classList.remove("pr"),350);fn();setTimeout(poll,200)};
function drawSel(){const seen={},gp=[];SL.forEach(x=>{if(!seen[x.mk]){seen[x.mk]=1;gp.push(x)}});
 $("gps").innerHTML=gp.map(x=>`<div class="gp2${x.mk===selM?" sel":""}" data-m="${x.mk}"><b>${x.country}</b><small>${x.loc} · ${x.date.slice(5)}</small></div>`).join("");
 $("ses").innerHTML=SL.filter(x=>x.mk===selM).sort((a,b)=>a.ts-b.ts).map(x=>`<button class="${x.key===selK?"sel":""}" data-k="${x.key}">${SN[x.name]||x.name}</button>`).join("")}
function rp(j){const m=j.replay;if(!m)return;
 $("rmsg").textContent=m.loading?"Carico la sessione…":m.err?"Errore: "+m.err:m.on?"Replay (max 2x)":"";
 $("rl").disabled=m.loading;$("rl").textContent=m.loading?"Carico "+m.prog+"/"+m.progTotal+"…":"Carica replay";$("rl").classList.toggle("on",m.loading);
 $("rpp").textContent=m.playing?"⏸":"▶";$("rpp").classList.toggle("on",m.playing);$("rsp").textContent=m.speed+"x";$("rsp").classList.toggle("on",m.speed>1);
 if(!drag)$("rr").value=Math.round(m.frac*1000);if(m.on){$("st").textContent="REPLAY";$("st").className="live"}}
(async()=>{try{const l=await (await fetch("/replay/sessions")).json();if(!Array.isArray(l)||!l.length)return;SL=l;
 selM=l[0].mk;const r=l.filter(x=>x.mk===selM&&x.name==="Race")[0]||l.filter(x=>x.mk===selM)[0];selK=r.key;drawSel();$("rp").style.display="flex";
 $("gps").onclick=e=>{const d=e.target.closest(".gp2");if(!d)return;selM=+d.dataset.m;const f=SL.filter(x=>x.mk===selM);selK=(f.filter(x=>x.name==="Race")[0]||f[f.length-1]).key;drawSel()};
 $("ses").onclick=e=>{const b=e.target.closest("button");if(!b)return;selK=+b.dataset.k;drawSel()};
 $("rl").onclick=function(){act(this,()=>{this.textContent="Carico…";this.classList.add("on");fetch("/replay/load?key="+selK)})};
 $("rpp").onclick=function(){act(this,()=>{const on=this.textContent==="▶";this.textContent=on?"⏸":"▶";this.classList.toggle("on",on);ctl("play="+(on?1:0))})};
 $("rsp").onclick=function(){act(this,()=>{const f=this.textContent==="1x";this.textContent=f?"2x":"1x";this.classList.toggle("on",f);ctl("speed="+(f?2:1))})};
 $("rx").onclick=function(){act(this,()=>ctl("off=1"))};
 $("rgo").onclick=function(){if($("rg").value)act(this,()=>ctl("lap="+$("rg").value))};
 $("rto").onclick=function(){if($("rt").value)act(this,()=>ctl("clock="+$("rt").value))};
 $("rr").oninput=()=>{drag=true};$("rr").onchange=async()=>{await ctl("pos="+$("rr").value/1000);drag=false;poll()};
}catch(e){}})();
poll();setInterval(poll,1000);setInterval(()=>strip(LAST),1000);
</script></body></html>
